name: poll

# ATS polling runs here (Node, no Worker CPU limit), covering every active company each run.
# The Worker only serves the console/bot/CV and delivers Telegram via /api/notify.
# Triggered by the Worker's Cloudflare cron via workflow_dispatch (reliable), at noon & 17:00 COT —
# GitHub's own schedule cron proved unreliable for this repo, so it's intentionally not used here.
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'trigger source label (cron = Worker-driven, manual = hand-run)'
        default: manual

concurrency:
  group: poll
  cancel-in-progress: false # never cut a run mid-flight; skip if one is already going

jobs:
  poll:
    runs-on: ubuntu-latest
    # Healthy runs are 15-90 s; a capped catch-up over a backlog is a few minutes. Fail fast instead
    # of sitting on the 6 h default: a wedged run (2026-07-28) held its `runs` row open for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Poll
        run: npx tsx scripts/poll.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # D1 database id is public (wrangler.jsonc), not a secret.
          D1_DATABASE_ID: f9e94936-ecac-4d34-b2e1-eb038f0995ea
          # Worker base URL (repo Variable) + the Worker's API_TOKEN (Secret) to reach /api/notify.
          WORKER_URL: ${{ vars.WORKER_URL }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          # 'cron' when the Worker fires the dispatch, 'manual' for a hand-run (labels the run honestly).
          POLL_SOURCE: ${{ github.event.inputs.source }}
