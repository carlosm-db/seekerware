name: poll

# ATS polling runs here (Node, no Worker CPU limit), covering every active company each run.
# The Worker only serves the console/bot/CV and delivers Telegram via /api/notify.
on:
  schedule:
    # Twice a day: 12:00 (noon) and 17:00 America/Bogota (UTC-5) = 17:00 and 22:00 UTC. GitHub cron is UTC.
    # (Overnight 17:00→07:00 boards are idle; noon catches the morning's postings.)
    - cron: '0 17,22 * * *'
  workflow_dispatch: {} # manual run from the Actions tab

concurrency:
  group: poll
  cancel-in-progress: false # never cut a run mid-flight; skip if one is already going

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Poll
        run: npx tsx scripts/poll.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # D1 database id is public (wrangler.jsonc), not a secret.
          D1_DATABASE_ID: f9e94936-ecac-4d34-b2e1-eb038f0995ea
          # Worker base URL (repo Variable) + the Worker's API_TOKEN (Secret) to reach /api/notify.
          WORKER_URL: ${{ vars.WORKER_URL }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
