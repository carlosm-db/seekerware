name: probe-co

# Reachability diagnostic for non-ATS sources (born as the throwaway probe of audit
# 2026-08-10-actions-ip-probe.md; adopted on main 2026-08-18): fetches a board's SSR pages from a
# GitHub-hosted runner to decide whether its connector can poll from Actions or needs a fallback
# runner. Hand-run only. The report is PRINTED to the job log — copy it into a dated audit doc;
# nothing is committed back. Point it at a new source by editing scripts/probe-co.mjs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-co
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe boards
        run: node scripts/probe-co.mjs
